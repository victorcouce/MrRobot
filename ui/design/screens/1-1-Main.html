    .chatrow.on { background: #FFFFFF; color: #16161A; box-shadow: 0 0 0 1px #E6E5DF; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .footrow { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; font-size: 13.5px; color: #44444B; width: 100%; text-align: left; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #E6E5DF; background: #FFFFFF; font-size: 12.5px; color: #44444B; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #55555C; font-weight: 500; }
    .field input, .field select { height: 34px; border-radius: 8px; border: 1px solid #E6E5DF; background: #FFFFFF; padding: 0 10px; font-size: 13px; color: #16161A; font-weight: 400; }
    .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .recent { display: grid; grid-template-columns: minmax(0, 1fr) 120px 160px 90px; align-items: center; gap: 16px; height: 52px; padding: 0 16px; border-bottom: 1px solid #F0EFEA; font-size: 13.5px; }
    .rail { width: 64px; flex-shrink: 0; border-right: 1px solid #ECEBE6; background: #F5F4F0; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; }

    .rbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: #55555C; display: inline-flex; align-items: center; justify-content: center; position: relative; }
    .rdark { background: #3346E0; color: #FFFFFF; }
    .rsep { width: 24px; height: 1px; background: #E6E5DF; margin: 4px 0; }
    .rproj { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #E6E5DF; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #44444B; position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .rproj.on { border-color: #16161A; box-shadow: 0 0 0 1px #16161A; color: #16161A; }
    .rdot { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #F5F4F0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .live { animation: pulse 1.6s ease-in-out infinite; }
  </style>
